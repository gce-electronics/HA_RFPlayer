---
name: "Feature request"
description: "Suggest an idea for this project"
labels: ["enhancement"]
body:
- type: markdown
  attributes:
    value: Before you open a new feature request, search through the existing feature requests to see if others have had the same idea.
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have filled out the template to the best of my ability.
        required: true
      - label: This only contains 1 feature request (if you have multiple feature requests, open one feature request for each feature request).
        required: true
      - label: This issue is not a duplicate feature request of [previous feature requests](https://github.com/gce-electronics/HA_RFPlayer/issues?q=is%3Aissue+label%3Aenhancement).
        required: true

- type: textarea
  attributes:
    label: "Is your feature request related to a problem? Please describe."
    description: "A clear and concise description of what the problem is."
    placeholder: "I'm always frustrated when [...]"
  validations:
    required: true

- type: textarea
  attributes:
    label: "Describe the solution you'd like"
    description: "A clear and concise description of what you want to happen."
  validations:
    required: true

- type: textarea
  attributes:
    label: "Describe alternatives you've considered"
    description: "A clear and concise description of any alternative solutions or features you've considered."
  validations:
    required: true

- type: textarea
  attributes:
    label: "Additional context"
    description: "Add any other context or screenshots about the feature request here."
  validations:
    required: true

- type: dropdown
  id: ai-usage
  attributes:
    label: "AI assistance"
    description: "Did you use an AI tool (Claude, ChatGPT, Copilot...) to analyze the problem or write this issue?"
    options:
      - "No"
      - "Yes"
  validations:
    required: true

- type: input
  id: ai-details
  attributes:
    label: "AI tool, model and effort"
    description: "Required if AI was used: the tool, the model, the reasoning effort (if the tool exposes it) and what the AI did."
    placeholder: "Claude Code, Claude Opus 5.5, effort high: root cause analysis"

name: "Test"

on:
  workflow_call:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      - name: "Install dependencies"
        run: uv sync --frozen

      - name: Check integration requirements against HA
        run: |
          HA_VERSION=$(uv tree --depth 1 --package homeassistant | sed -n 's/^homeassistant v\([^ ]*\)$/\1/p')

          echo "Testing HA $HA_VERSION"

          curl -fsSL \
            "https://raw.githubusercontent.com/home-assistant/core/${HA_VERSION}/homeassistant/package_constraints.txt" \
            -o /tmp/ha-constraints.txt

          uv pip compile pyproject.toml \
            --constraint /tmp/ha-constraints.txt \
            --output-file /tmp/requirements-resolved.txt

      - name: "Lint & Format"
        run: |
          uv run --no-sync ruff format --check
          uv run --no-sync ruff check

      - name: "Typing"
        run: |
          uv run --no-sync ty check custom_components tests

      - name: "Tests"
        run: |
          mkdir -p reports
          uv run --no-sync pytest --cov-report html:reports/coverage  --html=reports/test.html --cov=custom_components.rfplayer  tests/

      - uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports
